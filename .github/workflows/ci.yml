name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        # The test process sometimes crashes here with signal 11 and no trace (#332). The
        # backtracer prints the crashing thread's stack to the log, and the crash report is kept
        # below, so the next crash says where it happened.
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no,threads=all
        run: swift test
      - name: Keep crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports
          path: |
            ~/Library/Logs/DiagnosticReports/*ProofKitTests*
            ~/Library/Logs/DiagnosticReports/*swiftpm-testing-helper*
          if-no-files-found: ignore
      - name: Build Mac app
        run: xcodebuild -project App/Proof.xcodeproj -scheme Proof -configuration Debug build

  # The simulator tests take 5 to 10 minutes, so they run only when what they
  # test changes: ProofKit, the tests, the package or this workflow. They test
  # only ProofKit; ProofUI and the apps are checked by the iOS builds. A new
  # test target for ProofUI would need Sources/ProofUI added below.
  changes:
    name: Check what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.diff.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        # git diff exits 0 for no changes and 1 for changes. Anything else,
        # such as a base it can't find, runs the tests to be safe.
        run: |
          set +e
          git diff --quiet "$BASE" HEAD -- Sources/ProofKit Tests Package.swift .github/workflows/ci.yml
          status=$?
          if [ "$status" -eq 0 ]; then package=false; else package=true; fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "Package, tests or workflow changed: $package"

  # The simulator tests and the iOS builds run as two jobs, beside the Mac job,
  # so no job waits for another's builds.
  ios-test:
    name: Test on an iPhone simulator
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Choose an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available | grep -m1 -E '^ +iPhone' | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          echo "udid=$udid" >> "$GITHUB_ENV"
      # The simulator starts only after the build: starting it alongside the
      # build slowed both, as they compete for the runner (#265).
      - name: Build the tests
        run: xcodebuild build-for-testing -scheme Proof-Package -destination "id=$udid"
      - name: Start the iPhone simulator
        run: |
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Test on the iPhone simulator
        run: xcodebuild test-without-building -scheme Proof-Package -destination "id=$udid"

  ios-build:
    name: Build for iOS
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS
        run: xcodebuild -scheme Proof-Package -destination 'generic/platform=iOS' build
      - name: Build iOS app for the simulator
        run: xcodebuild -project App/Proof.xcodeproj -scheme ProofiOS -configuration Debug -destination 'generic/platform=iOS Simulator' build
