name: Feature
description: A piece of planned work
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this adds and why, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checkable acceptance criteria.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: APIs, references, constraints, open questions.
